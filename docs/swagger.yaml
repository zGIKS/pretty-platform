host: localhost:3000
info:
  contact: {}
  description: This is a products management API.
  title: Products API
  version: "1.0"
paths:
  /payments:
    post:
      consumes:
      - application/json
      description: Creates a Mercado Pago checkout preference tied to a product
      parameters:
      - description: Payment creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/resources.CreatePaymentResource'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resources.PaymentCreationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-service_internal_payments_interfaces_rest_resources.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-service_internal_payments_interfaces_rest_resources.ErrorResponse'
      summary: Create a payment preference
      tags:
      - payments
  /payments/{id}:
    get:
      description: Retrieve payment and preference details
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.PaymentResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-service_internal_payments_interfaces_rest_resources.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-service_internal_payments_interfaces_rest_resources.ErrorResponse'
      summary: Get payment by ID
      tags:
      - payments
  /products:
    get:
      description: Retrieve all products with optional pagination
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/resources.ProductResource'
            type: array
      summary: Get all products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a new product with the provided details
      parameters:
      - description: Product creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/resources.CreateProductResource'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resources.ProductResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
      summary: Create a new product
      tags:
      - products
  /products/{id}:
    delete:
      description: Delete a product by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
      summary: Delete product
      tags:
      - products
    get:
      description: Retrieve a product by its ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.ProductResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
      summary: Get product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Update an existing product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/resources.UpdateProductResource'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.ProductResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-service_internal_products_interfaces_rest_resources.ErrorResponse'
      summary: Update product
      tags:
      - products
swagger: "2.0"
